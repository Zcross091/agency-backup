<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vignette Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#14111D"/>
      <stop offset="65%" stop-color="#08070C"/>
      <stop offset="100%" stop-color="#040307"/>
    </radialGradient>

    <!-- Warm Radial Core Glow behind Symbol -->
    <radialGradient id="core-glow" cx="50%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#FFD3AC" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#E5A975" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Stroke Gradient for 'N' Mark -->
    <linearGradient id="n-grad" x1="130" y1="110" x2="380" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFE4CC"/>
      <stop offset="60%" stop-color="#FFD3AC"/>
      <stop offset="100%" stop-color="#D9975D"/>
    </linearGradient>

    <!-- Metallic Gold Gradient for 'EX' & Accent -->
    <linearGradient id="ex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2E3"/>
      <stop offset="50%" stop-color="#FFD3AC"/>
      <stop offset="100%" stop-color="#E5A975"/>
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD3AC" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#E5A975" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD3AC" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow Drop Shadow Filter -->
    <filter id="orbital-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 1:1 Circular Base Container (Optimized for WhatsApp / Discord / Google Profile Circular Crop) -->
  <circle cx="256" cy="256" r="256" fill="url(#bg-grad)"/>

  <!-- Subtle Circular Tech Ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#ring-grad)" stroke-width="2"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Core Ambient Glow Behind Logo Mark -->
  <circle cx="256" cy="205" r="160" fill="url(#core-glow)"/>

  <!-- Stylized Geometric "N" Mark (Identical DNA to original favicon) -->
  <g filter="url(#subtle-shadow)">
    <!-- Main Interconnected Bold Geometric N Lines -->
    <path d="M155 295 V125 L315 295 V125" 
          stroke="url(#n-grad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>

    <!-- Prominent Luminous Orbital Dot (Brand Dot) -->
    <circle cx="375" cy="125" r="21" fill="url(#ex-grad)" filter="url(#orbital-glow)"/>
    <circle cx="375" cy="125" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Typography: NORTHEX MARKETING -->
  <g text-anchor="middle" id="brand-text">
    <!-- NORTH (Crisp Clean White) + EX (Warm Metallic Gold) -->
    <text x="256" y="388" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="9">
      <tspan fill="#F8FAFC">NORTH</tspan><tspan fill="url(#ex-grad)">EX</tspan>
    </text>

    <!-- MARKETING (Subtle Spaced Out Sub-Badge) -->
    <text x="256" y="425" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#94A3B8" letter-spacing="11">
      MARKETING
    </text>
  </g>
</svg>
