<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="logo-grad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFD3AC"/>
      <stop offset="100%" stop-color="#E5A975"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFD3AC" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Obsidian Luxury Rounded Container -->
  <rect width="64" height="64" rx="14" fill="#0B0806"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#FFD3AC" stroke-width="2" stroke-opacity="0.35"/>
  
  <!-- Stylized Geometric "N" Mark -->
  <path d="M16 48V16L40 48V16" stroke="url(#logo-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Premium Glowing Dot -->
  <circle cx="50" cy="16" r="5" fill="#FFD3AC" filter="url(#glow)"/>
</svg>
