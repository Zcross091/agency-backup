<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="avatar-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A140F"/>
      <stop offset="60%" stop-color="#110C08"/>
      <stop offset="100%" stop-color="#080604"/>
    </radialGradient>
    <radialGradient id="gold-glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FFD3AC" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#E8B486" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2E3" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFD3AC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D49B6A" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="silhouette-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4CC" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFD3AC" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#9C6B40" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="250" cy="250" r="248" fill="url(#avatar-bg)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="250" cy="230" r="170" fill="url(#gold-glow)"/>

  <!-- Tech Rim Ring -->
  <circle cx="250" cy="250" r="246" fill="none" stroke="url(#rim-grad)" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="238" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Stylized Executive Silhouette -->
  <g filter="url(#soft-glow)">
    <!-- Head -->
    <circle cx="250" cy="185" r="68" fill="url(#silhouette-grad)"/>
    <!-- Shoulders & Torso -->
    <path d="M125 365 C125 285, 175 270, 250 270 C325 270, 375 285, 375 365 C375 390, 360 415, 345 425 C315 440, 185 440, 155 425 C140 415, 125 390, 125 365 Z" fill="url(#silhouette-grad)"/>
  </g>

  <!-- Star / Sparkle Accent -->
  <g transform="translate(325, 135) scale(0.8)">
    <path d="M0 -20 Q0 0 20 0 Q0 0 0 20 Q0 0 -20 0 Q0 0 0 -20 Z" fill="#FFE4CC" opacity="0.85"/>
  </g>
</svg>
